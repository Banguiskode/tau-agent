name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Tau from source
        run: |
          git clone --depth 1 https://github.com/IDNI/tau-lang.git /tmp/tau-lang
          cd /tmp/tau-lang
          ./scripts/setup-ubuntu-ci-deps.sh
          ./dev release -DTAU_BUILD_JOBS=2
          echo "/tmp/tau-lang/build-Release" >> "$GITHUB_PATH"
          /tmp/tau-lang/build-Release/tau --version
      - name: Run complete harness tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run Tau transition gate
        run: python3 scripts/run_tau_gate.py
