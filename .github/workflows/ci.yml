name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tau
        run: |
          curl -fsSL -o /tmp/tau.deb https://github.com/IDNI/tau-lang/releases/download/v0.7-alpha/tau-0.7-Linux.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/tau.deb
          tau --version
      - name: Run complete harness tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run Tau transition gate
        run: python3 scripts/run_tau_gate.py
